name: Semantic Release

on:
  workflow_run:
    workflows: ["exist-db CI"]
    branches: [develop]
    types:
      - completed

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # The default GITHUB_TOKEN cannot push the release commit through the
      # protection on develop; mint a short-lived token for the exist-bot
      # GitHub App (a bypass actor) instead.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci --omit=optional
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: exist-bot[bot]
          GIT_AUTHOR_EMAIL: 318278501+exist-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: exist-bot[bot]
          GIT_COMMITTER_EMAIL: 318278501+exist-bot[bot]@users.noreply.github.com

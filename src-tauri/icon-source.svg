<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b4a7a"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299e1"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="92" ry="92" fill="none" stroke="#2b6cb0" stroke-width="1.5" opacity="0.3"/>

  <!-- eXist-db dot pattern (characteristic scattered circles) -->
  <!-- Large dots - dark gray (background dots) -->
  <circle cx="180" cy="200" r="28" fill="#a0aec0" opacity="0.55"/>
  <circle cx="280" cy="140" r="14" fill="#a0aec0" opacity="0.5"/>
  <circle cx="300" cy="240" r="18" fill="#a0aec0" opacity="0.5"/>
  <circle cx="140" cy="360" r="22" fill="#a0aec0" opacity="0.5"/>
  <circle cx="130" cy="160" r="10" fill="#a0aec0" opacity="0.45"/>
  <circle cx="160" cy="300" r="8" fill="#a0aec0" opacity="0.45"/>
  <circle cx="350" cy="380" r="10" fill="#a0aec0" opacity="0.45"/>

  <!-- Medium dots - dark (text dots) -->
  <circle cx="240" cy="310" r="16" fill="#a0aec0" opacity="0.55"/>
  <circle cx="310" cy="360" r="20" fill="#a0aec0" opacity="0.5"/>
  <circle cx="150" cy="120" r="12" fill="#a0aec0" opacity="0.45"/>
  <circle cx="110" cy="390" r="8" fill="#a0aec0" opacity="0.45"/>
  <circle cx="270" cy="400" r="10" fill="#718096" opacity="0.35"/>

  <!-- Accent dots - eXist blue (the "life" of the logo) -->
  <circle cx="170" cy="130" r="15" fill="url(#accent)" opacity="0.9"/>
  <circle cx="155" cy="180" r="10" fill="url(#accent)" opacity="0.85"/>
  <circle cx="330" cy="110" r="12" fill="url(#accent)" opacity="0.8"/>
  <circle cx="370" cy="140" r="20" fill="url(#accent)" opacity="0.75"/>
  <circle cx="200" cy="280" r="14" fill="url(#accent)" opacity="0.85"/>
  <circle cx="175" cy="340" r="12" fill="url(#accent)" opacity="0.8"/>
  <circle cx="340" cy="290" r="12" fill="url(#accent)" opacity="0.8"/>
  <circle cx="370" cy="340" r="14" fill="url(#accent)" opacity="0.85"/>
  <circle cx="120" cy="80" r="6" fill="url(#accent)" opacity="0.7"/>
  <circle cx="110" cy="60" r="6" fill="url(#accent)" opacity="0.9"/>
  <circle cx="145" cy="310" r="8" fill="url(#accent)" opacity="0.75"/>

  <!-- Code bracket symbols — representing the IDE -->
  <g transform="translate(256, 256)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left angle bracket < -->
    <path d="M-60,-55 L-110,0 L-60,55" stroke="#e2e8f0" stroke-width="18" opacity="0.95"/>
    <!-- Right angle bracket > -->
    <path d="M60,-55 L110,0 L60,55" stroke="#e2e8f0" stroke-width="18" opacity="0.95"/>
    <!-- Forward slash / -->
    <path d="M25,-65 L-25,65" stroke="#4299e1" stroke-width="14" opacity="0.9"/>
  </g>
</svg>
